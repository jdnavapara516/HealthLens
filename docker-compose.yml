services:
  db:
    image: pgvector/pgvector:pg16
    container_name: healthlens-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthlens}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-healthlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: healthlens-fastapi
    environment:
      APP_NAME: ${APP_NAME:-HealthLens AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      database_url: postgresql+psycopg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-healthlens}
      hf_token: ${HF_TOKEN:-}
      groq_api_key: ${GROQ_API_KEY:-}
      groq_model: ${GROQ_MODEL:-openai/gpt-oss-120b}
      embedding_model: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django/media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: healthlens-django
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-development-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,django}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-healthlens}
      FASTAPI_URL: ${FASTAPI_URL:-http://fastapi:8000}
      FASTAPI_AI_URL: ${FASTAPI_URL:-http://fastapi:8000}
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    volumes:
      - ./django/media:/app/media
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  postgres_data:
