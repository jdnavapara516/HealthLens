{% extends 'base.html' %}
{% block title %}{{ report.name }} | HealthLens AI{% endblock %}
{% block content %}<a class="back-link" href="{% url 'home' %}">&larr; Dashboard</a><section class="panel detail-panel"><p class="eyebrow">Health report</p><h1>{{ report.name }}</h1><p class="muted">Uploaded {{ report.created_at|date:'j M Y, H:i' }} &middot; {{ report.get_status_display }}</p><a class="button" href="{% url 'conversation' report.conversation.id %}">Open chat</a></section>{% endblock %}
