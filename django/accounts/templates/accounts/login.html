{% extends 'base.html' %}
{% block title %}Log in | HealthLens AI{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in to HealthLens</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="button" type="submit">Log in</button></form><p class="form-footer">New here? <a href="{% url 'signup' %}">Create an account</a></p></section>{% endblock %}
