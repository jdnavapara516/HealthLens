{% extends 'base.html' %}
{% block title %}Create account | HealthLens AI{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">Private health workspace</p><h1>Create your account</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="button" type="submit">Create account</button></form><p class="form-footer">Already registered? <a href="{% url 'login' %}">Log in</a></p></section>{% endblock %}
