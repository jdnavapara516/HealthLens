{% extends 'base.html' %}
{% block title %}Password reset sent | HealthLens AI{% endblock %}
{% block content %}
<section class="auth-shell narrow-shell">
    <div class="auth-panel success-panel">
        <div class="auth-header">
            <span class="eyebrow">Check your inbox</span>
            <h2>Password reset email sent</h2>
        </div>
        <p>If an account exists for that email address, we have sent a password reset link.</p>
        <a class="button button-primary" href="{% url 'login' %}">Back to login</a>
    </div>
</section>
{% endblock %}
