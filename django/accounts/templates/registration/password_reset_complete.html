{% extends 'base.html' %}
{% block title %}Password reset complete | HealthLens AI{% endblock %}
{% block content %}
<section class="auth-shell narrow-shell">
    <div class="auth-panel success-panel">
        <div class="auth-header">
            <span class="eyebrow">Success</span>
            <h2>Password reset complete</h2>
        </div>
        <p>Your password has been reset. You can now sign in with your new credentials.</p>
        <a class="button button-primary" href="{% url 'login' %}">Log in</a>
    </div>
</section>
{% endblock %}
