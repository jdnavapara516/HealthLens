name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.EC2_USERNAME }}/healthlens
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm django python manage.py migrate
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            curl --fail --retry 10 --retry-delay 3 http://localhost:8000/health