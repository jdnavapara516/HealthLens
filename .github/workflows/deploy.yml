name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.EC2_USERNAME }}/healthlens
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm django python manage.py migrate
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T fastapi \
                python -c "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=5).read()" \
                >/dev/null 2>&1; then
                exit 0
              fi
              sleep 2
            done

            docker compose -f docker-compose.prod.yml logs --tail=100 fastapi django
            exit 1
