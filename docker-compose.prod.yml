services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    image: ${DOCKERHUB_USERNAME}/healthlens-fastapi:${IMAGE_TAG:-latest}
    environment:
      APP_NAME: ${APP_NAME:-HealthLens AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      database_url: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      hf_token: ${HF_TOKEN}
      groq_api_key: ${GROQ_API_KEY}
      groq_model: ${GROQ_MODEL:-openai/gpt-oss-120b}
      embedding_model: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django/media:/app/media
    restart: unless-stopped

  django:
    image: ${DOCKERHUB_USERNAME}/healthlens-django:${IMAGE_TAG:-latest}
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FASTAPI_URL: http://fastapi:8000
      FASTAPI_AI_URL: http://fastapi:8000
    depends_on:
      db:
        condition: service_healthy
      fastapi:
        condition: service_started
    volumes:
      - ./django/media:/app/media
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  postgres_data: